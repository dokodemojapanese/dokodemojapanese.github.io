name: Sabbath push

# v1.0.215: 3 times a day in Japan time + 3 times a day in Myanmar time (6 runs).
# Times below are UTC. push.js picks the zone and slot from the schedule.
on:
  schedule:
    - cron: '0 22 * * *'    # 07:00 Japan    (Sabbath / good morning)
    - cron: '0 3 * * *'     # 12:00 Japan    (word of the day)
    - cron: '0 11 * * *'    # 20:00 Japan    (study reminder)
    - cron: '30 0 * * *'    # 07:00 Myanmar  (Sabbath / good morning)
    - cron: '30 5 * * *'    # 12:00 Myanmar  (word of the day)
    - cron: '30 13 * * *'   # 20:00 Myanmar  (study reminder)
  workflow_dispatch:
    inputs:
      mode:
        description: 'custom = your own message (fill the boxes below) · test · am · noon · pm'
        type: choice
        options: [custom, test, am, noon, pm]
        default: test
      zone:
        description: 'jp = Japan-time users · mm = Myanmar-time users · all = everyone'
        type: choice
        options: [all, jp, mm]
        default: all
      title:
        description: 'custom: title (e.g. 電子レンジ)'
        required: false
      body:
        description: 'custom: message (e.g. မိုက်ခရိုဝေ့ဖ်မီးဖို (Microwave))'
        required: false
      jp:
        description: 'custom: Japanese line read aloud (e.g. でんしレンジ)'
        required: false
      word:
        description: 'custom: word to open in ど Dictionary when tapped (e.g. 電子レンジ)'
        required: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install firebase-admin@12 --no-save --no-audit --no-fund
      - run: node push.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          SCHED: ${{ github.event.schedule }}
          MODE: ${{ github.event.inputs.mode || 'test' }}
          ZONE: ${{ github.event.inputs.zone || 'jp' }}
          CTITLE: ${{ github.event.inputs.title }}
          CBODY: ${{ github.event.inputs.body }}
          CJP: ${{ github.event.inputs.jp }}
          CWORD: ${{ github.event.inputs.word }}
